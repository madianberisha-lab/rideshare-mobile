<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b101b"><title>RideShare - Lista offline</title><style>body{margin:0;background:#0b101b;color:#edf2ff;font:18px/1.6 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:24px}h1{font-size:clamp(28px,7vw,42px)}button,a{font:inherit;color:inherit}button{padding:12px 18px;border:2px solid #fda4af;border-radius:12px;background:#4b1e32;cursor:pointer}button:disabled{opacity:.7}.trip-card{padding:18px;margin:18px 0;border:1px solid #546078;border-radius:14px}#source{padding:16px;border-left:4px solid #fda4af;background:#1c2438}a{color:#fda4af}</style></head><body><main><p>RideShare AAB - Lexim publik</p><h1>Udhetimet, edhe pa internet</h1><p id="source" role="status" aria-live="polite">Po lexohet lista...</p><p>Ruajtur per here te fundit: <time id="saved">-</time></p><button id="refresh" type="button">Rifresko listen</button><div id="trips"></div><button disabled>Kerkesa per vend nuk funksionon ne pamjen offline</button><p>Kjo pamje eshte vetem per lexim. Kopja mund te jete e vjeter; asnje rezervim nuk konfirmohet.</p><a href="/">Kthehu te aplikacioni</a></main><script>const source=document.querySelector("#source"),list=document.querySelector("#trips"),refresh=document.querySelector("#refresh");async function load(){refresh.disabled=true;source.textContent="Po kerkohet lista...";try{const r=await fetch("/api/udhetimet",{cache:"no-store"}),d=await r.json();if(!r.ok||!Array.isArray(Array.isArray(d)?d:d.trips))throw Error();list.replaceChildren();for(const t of (Array.isArray(d)?d:d.trips)){const c=document.createElement("article");c.className="trip-card";const h=document.createElement("h2");h.textContent=t.nisja+" -> "+t.destinacioni;const p=document.createElement("p");p.textContent="Ora: "+t.ora+" | Vende ne kopjen e ruajtur: "+t.vende;c.append(h,p);list.append(c)}const saved=r.headers.get("x-rideshare-saved-at");document.querySelector("#saved").textContent=saved?new Date(saved).toLocaleString("sq-AL"):"Koha nuk u raportua";source.textContent=r.headers.get("x-rideshare-source")==="cache"?"Lista e ruajtur. Mund te jete e vjeter.":"Lista u lexua nga serveri."}catch{source.textContent=list.children.length?"Lidhja deshtoi; lista mund te jete e vjeter.":"Nuk ka liste te ruajtur. Hape fillimisht me internet."}finally{refresh.disabled=false}}refresh.addEventListener("click",load);window.addEventListener("online",()=>{source.textContent="Lidhja u rikthye. Shtyp Rifresko listen."});window.addEventListener("offline",()=>{source.textContent="Pa internet. Lista mund te jete e vjeter."});load();</script></body></html>
